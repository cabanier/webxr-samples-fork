    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dispatch UI</title>
    <style>
      :root {
        color-scheme: light;
        font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #ffffff;
        color: #202428;
      }

      .shell {
        display: grid;
        width: 100%;
        height: 100%;
        grid-template-rows: auto 1fr auto;
        border: 2px solid #26323b;
        background: #ffffff;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        background: #f4f6f7;
      }

      header {
        border-bottom: 1px solid #d5dadd;
      }

      footer {
        border-top: 1px solid #d5dadd;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 20px;
        letter-spacing: 0;
      }

      h2 {
        margin-bottom: 8px;
        font-size: 13px;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .live-state {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #216343;
        font-weight: 700;
      }

      .live-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #2d9861;
        animation: pulse 1.2s ease-in-out infinite alternate;
      }

      .content {
        display: grid;
        min-height: 0;
        grid-template-columns: 1.2fr 0.8fr;
      }

      .queue,
      .settings {
        min-width: 0;
        padding: 14px 16px;
      }

      .settings {
        border-left: 1px solid #d5dadd;
        background: #fbfcfc;
      }

      .task-list {
        height: 116px;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        list-style: none;
        border-top: 1px solid #d5dadd;
      }

      .task-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 2px;
        border-bottom: 1px solid #e3e6e8;
      }

      .task-list strong {
        font-weight: 650;
      }

      .task-list span {
        color: #5e6870;
        white-space: nowrap;
      }

      .mode-toggle {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-top: 10px;
        cursor: pointer;
      }

      .mode-toggle input {
        width: 17px;
        height: 17px;
        margin: 1px 0 0;
        accent-color: #216343;
      }

      .mode-copy {
        display: grid;
        gap: 2px;
      }

      .mode-copy small,
      time {
        color: #68727a;
      }

      button {
        min-width: 102px;
        min-height: 36px;
        border: 1px solid #17533a;
        border-radius: 5px;
        background: #216343;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        background: #174d35;
      }

      button:active {
        background: #103d29;
      }

      #status {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @keyframes pulse {
        from {
          opacity: 0.45;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .live-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Dispatch</h1>
        <span class="live-state"><span class="live-dot"></span>Live</span>
      </header>

      <div class="content">
        <section class="queue">
          <h2>Task queue</h2>
          <ol id="task-list" class="task-list" tabindex="0">
            <li><strong>Inspect loading bay</strong><span>Now</span></li>
            <li><strong>Verify sensor grid</strong><span>4 min</span></li>
            <li><strong>Archive route data</strong><span>12 min</span></li>
            <li><strong>Review diagnostics</strong><span>18 min</span></li>
          </ol>
        </section>

        <section class="settings">
          <h2>Routing</h2>
          <p>Assign new work to the active operator.</p>
          <label class="mode-toggle">
            <input id="priority-mode" type="checkbox" checked>
            <span class="mode-copy">
              <strong>Priority mode</strong>
              <small id="mode-state">Urgent tasks first</small>
            </span>
          </label>
        </section>
      </div>

      <footer>
        <span id="status" aria-live="polite">Queue synchronized</span>
        <time id="updated-time"></time>
        <button id="add-task" type="button">Add task</button>
      </footer>
    </main>

    <script>
      const taskList = document.getElementById('task-list');
      const priorityMode = document.getElementById('priority-mode');
      const modeState = document.getElementById('mode-state');
      const status = document.getElementById('status');
      const updatedTime = document.getElementById('updated-time');
      const addTask = document.getElementById('add-task');
      let taskCount = taskList.children.length;

      function notifyParent() {
        window.parent.postMessage(
            {type: 'html-in-canvas-ui-changed'}, window.location.origin);
      }

      function updateTime() {
        updatedTime.textContent = new Intl.DateTimeFormat(undefined, {
          hour: 'numeric',
          minute: '2-digit',
          second: '2-digit',
        }).format(new Date());
        notifyParent();
      }

      addTask.addEventListener('click', () => {
        taskCount++;
        const task = document.createElement('li');
        task.innerHTML = `<strong>Follow-up task ${taskCount}</strong><span>Now</span>`;
        taskList.prepend(task);
        taskList.scrollTop = 0;
        status.textContent = `Task ${taskCount} added`;
        notifyParent();
      });

      priorityMode.addEventListener('change', () => {
        modeState.textContent = priorityMode.checked ?
            'Urgent tasks first' : 'Arrival order';
        status.textContent = priorityMode.checked ?
            'Priority routing enabled' : 'Priority routing disabled';
        notifyParent();
      });

      taskList.addEventListener('scroll', notifyParent, {passive: true});
      updateTime();
      window.setInterval(updateTime, 1000);
    </script>
  </body>
</html>
